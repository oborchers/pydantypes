name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal code to reproduce the issue.
      render: python
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    id: pydantic-version
    attributes:
      label: Pydantic version
      placeholder: "2.10.0"
    validations:
      required: true
  - type: input
    id: pydantypes-version
    attributes:
      label: pydantypes version
      placeholder: "0.1.0"
    validations:
      required: true
