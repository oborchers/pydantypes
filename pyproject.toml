[build-system]
requires = ["hatchling>=1.18.0", "hatch-vcs>=0.3.0,<1.0.0"]
build-backend = "hatchling.build"

[project]
name = "pydantypes"
dynamic = ["version"]
description = "The missing types for Pydantic — cloud, DevOps, web, and data engineering."
readme = "README.md"
license-expression = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Oliver Borchers" }]
keywords = ["pydantic", "types", "validation", "aws", "azure", "gcp", "cloud", "devops", "type-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Documentation = "https://oborchers.github.io/pydantypes/"
Repository = "https://github.com/oborchers/pydantypes"
Issues = "https://github.com/oborchers/pydantypes/issues"
Releases = "https://github.com/oborchers/pydantypes/releases"

# --- Version ---

[tool.hatch.version]
source = "vcs"
tag-pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.hatch.build.hooks.vcs]
version-file = "src/pydantypes/_version.py"
template = """# Auto-generated by hatch-vcs. Do not edit.
__version__ = "{version}"
version_tuple = {version_tuple}
"""

[tool.hatch.build.targets.wheel]
packages = ["src/pydantypes"]

# --- Dependency Groups ---

[dependency-groups]
dev = [
    "pre-commit>=3.0.0",
]
lint = [
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.0.0",
    "dirty-equals>=0.7.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.27.0",
    "mkdocs-llmstxt>=0.2.0",
    "termynal>=0.12.0",
]
all = [
    { include-group = "dev" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
]

# --- Ruff ---

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
extend-exclude = ["_version.py"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "PLC", "RUF", "PT", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pydantypes"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]
"tests/test_import.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# --- mypy ---

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

# --- pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers --strict-config --tb=short"
filterwarnings = ["error"]

# --- Coverage ---

[tool.coverage.run]
source = ["pydantypes"]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.$",
]
